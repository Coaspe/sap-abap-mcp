name: Publish npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run verify:backports
      - run: npm run conformance:release
      - run: npm run smoke:v1
      - run: node scripts/sync-mcpb-tools.mjs --check
      - run: node scripts/sync-lobehub-manifest.mjs --check
      - run: npm run audit:backports
      - run: npm audit --omit=dev
      - run: npm audit signatures
      - run: npm publish --provenance --access public
