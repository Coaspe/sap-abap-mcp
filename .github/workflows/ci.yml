name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Verify minimum compatible Node 20 protocol and discovery
        if: matrix.node == '20'
        run: |
          node scripts/smoke-v1-stdio.mjs
          node scripts/benchmark-capability-discovery.mjs --tokens
          npm run build:mcpb

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/local-command.test.js dist/test/security-backports.test.js dist/test/token-efficiency.test.js dist/test/secret-store.test.js
      - run: node scripts/smoke-v1-stdio.mjs
      - run: node --test dist/test/stdio-launch.test.js dist/test/launch-contract.test.js dist/test/registration.test.js dist/test/host-config.test.js dist/test/tls-trust.test.js dist/test/saplogon-import.test.js dist/test/onboard.test.js dist/test/cli-profile.test.js dist/test/adt-background.test.js
      - run: npm run verify:backports
      - name: Verify native DPAPI with throwaway credentials
        run: node scripts/verify-native-store.mjs
      - name: Verify Windows installed tarball and npx.cmd
        shell: pwsh
        run: |
          node scripts/pack-runtime.mjs artifacts
          $tarball = node -p "'artifacts/coaspe-sap-abap-mcp-' + require('./package.json').version + '.tgz'"
          node scripts/verify-installation.mjs $tarball

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run smoke:v1
      - run: npm run conformance:release
      - run: npm run benchmark:workflow -- --tokens
      - run: npm run benchmark:workflow -- --tokens --known-capabilities
      - run: npm run benchmark:contracts
      - run: npm run benchmark:tokens
      - run: npm run benchmark:batch
      - run: npm run benchmark:conditional-batch -- --tokens
      - run: npm run benchmark:discovery -- --tokens
      - run: node scripts/sync-mcpb-tools.mjs --check
      - run: node scripts/sync-lobehub-manifest.mjs --check
      - name: Verify standalone desktop bundle and first-run setup
        run: npm run build:mcpb
      - name: Verify installed runtime package
        run: |
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          node scripts/pack-runtime.mjs "$package_dir" > "$package_dir/pack.json"
          package_file="$(node -e 'console.log(require(process.argv[1])[0].filename)' "$package_dir/pack.json")"
          npm install --prefix "$package_dir" --omit=dev --ignore-scripts --no-audit --no-fund "$package_dir/$package_file"
          cd "$package_dir/node_modules/@coaspe/sap-abap-mcp"
          node scripts/smoke-v1-stdio.mjs
          node scripts/verify-security-backports.mjs
          node scripts/check-profile-conformance.mjs --profile spec/sap-abap-mcp-release-profile-draft.json
          node scripts/benchmark-mcp-workflow.mjs
          node scripts/benchmark-capability-discovery.mjs
          node scripts/benchmark-public-contracts.mjs
          node scripts/benchmark-conditional-batch.mjs
      - run: npm run verify:backports
      - run: node scripts/check-evidence-index.mjs
      - name: Verify clean installed launch contract
        run: |
          node scripts/pack-runtime.mjs artifacts
          package_file="$(node -p "'artifacts/coaspe-sap-abap-mcp-' + require('./package.json').version + '.tgz'")"
          node scripts/verify-installation.mjs "$package_file"
      - run: npm run audit:backports
      - run: npm audit --omit=dev
      - run: npm audit signatures
