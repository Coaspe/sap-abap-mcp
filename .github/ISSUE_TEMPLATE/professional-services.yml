name: Transport release evidence pilot
description: Check fit for a paid, read-only transport evidence diagnostic or pilot without sharing confidential information.
title: "Transport evidence pilot: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue and the initial contact channel. Do not post company or customer names, SAP host names, transport numbers, credentials, source code, logs, tokens, internal architecture, or other confidential information.

        This service does not replace SAP Cloud ALM, ChaRM, ActiveControl, Rev-Trac, Project "Piper", or an already complete release-evidence workflow. See the [scope and prices](https://github.com/Coaspe/sap-abap-mcp/blob/main/SERVICES.md) before submitting.

  - type: dropdown
    id: service
    attributes:
      label: Requested next step
      options:
        - Paid compatibility diagnostic (up to two hours)
        - Three-business-day transport evidence pilot
        - 90-minute team workshop without SAP access
        - Not sure yet
    validations:
      required: true

  - type: input
    id: organization_type
    attributes:
      label: Organization type
      description: Do not provide a company or customer name.
      placeholder: Small SAP implementation partner, internal ERP team, or independent consultant
    validations:
      required: true

  - type: dropdown
    id: landscape
    attributes:
      label: Landscape category
      options:
        - ECC with classic transports
        - SAP S/4HANA on-premise or private cloud with classic transports
        - SAP BTP ABAP Environment
        - Mixed or not sure
    validations:
      required: true

  - type: dropdown
    id: current_control
    attributes:
      label: Current release evidence flow
      options:
        - ATC or ABAP Unit is manual or only partially enforced
        - Checks run, but results and the release decision are stored separately
        - Cloud ALM or ChaRM already preserves the complete evidence flow
        - ActiveControl or Rev-Trac already preserves the complete evidence flow
        - Project "Piper" or equivalent CI already preserves the complete evidence flow
        - Not sure
    validations:
      required: true

  - type: textarea
    id: evidence_gap
    attributes:
      label: Evidence gap to close
      description: Describe the release decision or evidence problem without identifiers, code, logs, or architecture details.
      placeholder: ATC is run before release, but the result and approval decision are not retained with the transport.
    validations:
      required: true

  - type: dropdown
    id: runner
    attributes:
      label: Customer-controlled runner
      description: Could an approved DEV/QAS machine run a read-only CLI and retain reports locally?
      options:
        - Yes
        - Possibly, subject to security review
        - No external CLI can run
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: timing
    attributes:
      label: Intended timing
      options:
        - Within 30 days
        - Within 90 days
        - Researching for later
    validations:
      required: true

  - type: input
    id: timezone
    attributes:
      label: Timezone and preferred working hours
      placeholder: Asia/Seoul, weekdays 09:00-18:00
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I am authorized to discuss this non-confidential background for my organization or project.
          required: true
        - label: I have not included names, credentials, source code, logs, tokens, host names, transport numbers, internal architecture, or other confidential information.
          required: true
